[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmloader"
version = "0.1.0"
description = "Desktop model loader with multi-backend routing"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "gguf>=0.10.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "aiosqlite>=0.20.0",
    "psutil>=5.9.0",
    "numpy>=1.26.0",
    "PySide6>=6.7.0",
    "PyYAML>=6.0",
]

[project.scripts]
lmcli = "lmloader.cli:app"
lmloader = "lmloader.__main__:main"
lmloader-gui = "lmloader.gui.main:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]  # FIXED: T1

[tool.setuptools.packages.find]
include = ["lmloader*"]
